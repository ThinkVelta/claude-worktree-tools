version: 2

# github-actions is the only active ecosystem. This package has zero runtime
# and zero dev dependencies and commits no lockfile, so an `npm` ecosystem
# would have nothing to bump; the linters are pinned by rev in
# .pre-commit-config.yaml (which Dependabot does not support) and by version in
# .mise.toml, so both are bumped by hand. See the commented-out npm stanza at
# the bottom for when that changes.
updates:
  - package-ecosystem: github-actions
    # `/` covers .github/workflows only; the composite-action directories are
    # listed explicitly so the action pins inside their action.yml files get
    # bumped too.
    directories:
      - "/"
      - "/.github/actions/codex-pr-review"
      - "/.github/actions/codex-pr-report"
    schedule:
      interval: monthly
    # Hold new releases for two weeks so broken, yanked, or compromised
    # versions have time to surface before they enter this repo's automation.
    cooldown:
      default-days: 14
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      ci-dependencies:
        patterns:
          - "*"

  # Enable once package.json gains real dependencies (runtime or dev) or a
  # committed lockfile. Kept commented out until then: this package is
  # deliberately dependency-free, so an active npm ecosystem would only add a
  # scheduled job that never finds anything to update.
  # - package-ecosystem: npm
  #   directory: /
  #   schedule:
  #     interval: monthly
  #   cooldown:
  #     default-days: 14
  #   commit-message:
  #     # `build` rather than `ci`: npm bumps change what ships to npm
  #     # consumers, not just the pipeline.
  #     prefix: "build"
  #     include: scope
  #   groups:
  #     npm-dependencies:
  #       patterns:
  #         - "*"
