name: CI

# Human-readable run names in the Actions list: PRs show their number, pushes
# show the branch that triggered them.
run-name: >-
  CI -
  ${{
    github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) ||
    github.ref_name
  }}

# Feature branches PR straight into `main` here: this repo has no `dev`, so
# `main` is an ordinary integration branch rather than a prod-deploy branch.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every linter lives behind pre-commit (see .pre-commit-config.yaml), so this
  # job is a thin driver: `make lint` here runs byte-identically to `make lint`
  # on a laptop and to the hook installed by `make prepare`.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Provisions uv and node from .mise.toml, so CI runs the exact tool
      # versions pinned for dev machines.
      - name: Install pinned tools
        uses: jdx/mise-action@v4.2.4
        with:
          install: true
          cache: true

      # `make lint` drives pre-commit, which builds every hook environment from
      # scratch on a cold runner. Keyed on the config that pins the hooks so a
      # hook or rev change misses the cache by construction; a partial
      # `restore-keys` hit is safe because pre-commit installs only what the
      # store is missing.
      - name: Cache pre-commit hook environments
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      - name: Cache uv download cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Lint
        run: make lint

  # The matrix is the point of this job: this package ships a node CLI plus bash
  # that runs on contributors' machines, so both axes are real risk surface.
  # node covers the range declared in package.json `engines.node` (>=20); the OS
  # axis catches GNU-vs-BSD divergence in the shell tooling (sed, awk, mktemp,
  # cksum) that the worktree scripts lean on. Runner images are pinned rather
  # than `-latest`: an alias rollover is a classic "CI broke and nobody changed
  # anything", and a portability matrix is exactly where that bites.
  test:
    name: Test (node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      # Run the whole grid: a failure in one cell is diagnostic precisely by
      # contrast with its siblings, so cancelling them throws away the signal.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node-version: ["20", "22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      # test.sh creates real git repos and commits into them, so the runner
      # needs an identity and a deterministic default branch name.
      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test.invalid"
          git config --global init.defaultBranch main

      # `make test`, not a bare `bash test.sh`: one command shape for CI and
      # laptops. It writes into tmp/, which is gitignored.
      - name: Run smoke tests
        run: make test
