name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Lint markdown
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules" "#.claude"

      - name: Check shell script syntax
        run: bash -n templates/wt-setup.sh

      - name: Shellcheck
        run: shellcheck templates/wt-setup.sh

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run smoke tests
        run: bash test.sh /tmp/cwt-ci-test
