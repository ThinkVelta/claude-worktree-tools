# mise: the single source of truth for tool versions across host, CI
# (jdx/mise-action), and agents.
# https://mise.jdx.dev/configuration.html
#
# Bootstrap: `curl https://mise.run | sh` (or `brew install mise`), then:
#   mise install                # installs every tool listed below
#   eval "$(mise activate zsh)" # auto-activate when you cd into the project
#
# uv is pinned because `make lint` drives pre-commit through `uvx`, and the pin
# keeps that resolution identical across developers and CI.
#
# node is pinned to the floor declared in package.json `engines.node`.
# Developing on the oldest supported runtime means an accidental newer-API call
# in bin/init.js fails here rather than on a user's machine; CI's matrix still
# covers 20/22/24 via actions/setup-node.
#
# The linters that pre-commit provisions itself (markdownlint-cli2, shellcheck,
# shfmt, actionlint, commitizen) are deliberately NOT re-pinned here: each comes
# from the rev pinned in .pre-commit-config.yaml.

[tools]
uv = "0.11.16"
node = "20"
